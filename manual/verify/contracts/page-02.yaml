# 第 2 页 · 导入 dw.sql —— 教材可跟随性契约（T0 静态）
#
# schema 与规则见 manual/verify/README.md。
# 本页三条命令都要连第 1 页手工起的 lab-mysql 容器（docker exec），属整栈/手工页，
# 无法在 CI 离线跑，因此 coverage: static：只验页面引用的路径存在、关键锚点符号命中，
# 不执行任何命令，页面也不挂 <!-- verify: --> 注解。
page: page-02
title: 第 2 页 · 导入 dw.sql：建表灌数据
coverage: static

static:
  paths:
    - fixtures/dw.sql                      # 页面第 1 条命令的输入（5 表 115 行数据源）
    - manual/page-01.md                    # 页面要求先建好的 lab-mysql（容器/端口/密码定义处）
    - contracts/schema.contract.yaml       # 页面期望的 5 表 / 115 行 / 数据口径的唯一事实源
    - manual/images/page-02-visual.webp     # 页面插图 images/page-02-visual.webp
    - manual/images/page-02-data-check.png # 页面「你应该看到」的真实输出截图
  symbols:
    # 库名 dw：页面第 2、3 条命令都用 -e "... dw ..." 指定它
    - {file: fixtures/dw.sql, pattern: "CREATE DATABASE IF NOT EXISTS dw"}
    # 表名 fact_order：页面用 SELECT COUNT(*) FROM fact_order 数 115 行
    - {file: fixtures/dw.sql, pattern: "CREATE TABLE fact_order"}
    # R004 = 北京市 = 华北：页面「华北 19 单」与前 3 单输出靠这条维表数据 JOIN 出来
    - {file: fixtures/dw.sql, pattern: "'R004', '北京市', '华北'"}
    # 容器名 lab-mysql：页面每条命令的 docker exec 目标；改名则整页命令失效
    - {file: manual/page-01.md, pattern: "--name lab-mysql"}
    # 密码 labpass：页面每条命令都带 -plabpass；改密码则连不上
    - {file: manual/page-01.md, pattern: "MYSQL_ROOT_PASSWORD=labpass"}
    # 行数契约：页面「115」的期望值；改契约必须同步改页面
    - {file: contracts/schema.contract.yaml, pattern: "expected_fact_rows: 115"}
