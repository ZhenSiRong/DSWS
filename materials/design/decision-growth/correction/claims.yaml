  - 'materials/deliverable/v2/README-v2.md:172 + evidence/v2-natural-correct-success.sse（v2 单次复现过成功态）'
  - 'tutorial/page-17.md（对账：猜 2；live_probe.py 五类口径，成功率分母 success+fail）'
  probe:
  - '(curl POST /api/query ×3 并按五类记账) — 需真模型 + 开栈（page-17 第 6 步），本轮未跑'
  ablation: []
  status: unknown
  probe_note: 'probe 2026-11-27：需真模型 POST /api/query ×3 记账，REBUILD_LLM_* 为空未跑——inferred→unknown（真模型采样未跑）'

