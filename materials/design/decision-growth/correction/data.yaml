answer_title: 一次有边界的补考
answer: 不是「多试几次」，是一次有边界的补考：只给可重试错误、最多 N 次、改完重过 guard + policy。
answer_small: 补考上限 N（契约名 correction.max_attempts）= 1，是当前值不是原则；不可动的是四条边界：可重试白名单、重校验、安全拒绝不重试、attempts 可观测。
