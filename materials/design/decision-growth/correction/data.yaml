figcap: 图 12 · S6（失败/校正门禁）校正闭环状态机：可重试才进「校验 → 校正 → 校验」唯一回退边（graph.py 条件路由）；上限 N=1（当前值）；执行失败不回退。失败注入与错误码映射见图 31。
