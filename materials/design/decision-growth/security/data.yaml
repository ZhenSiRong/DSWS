  add: 当前设计
answer_title: 三层防线，一个出口
answer: 不是“一道更严的关”，是三层独立防线（guard / policy / dw_reader）+ 一个统一出口。
answer_small: 契约白名单是 policy 的输入；guard / policy / dw_reader 各自拒绝；ChannelError 负责出口。
fig: materials/design/diagrams/04-security/22-sql-policy-flow.svg
figcap: 图 22 · 策略内部六关（单语句 → 只读 → 表白/列白 → 无常量 → 排序/LIMIT → 收尾）；六关不是三层本身；拒绝不连库。
ev:
- - E1 · 拒绝有据
  - 36/36 注入被拒
  - 安全语料按类别覆盖多语句、UNION、可执行注释、危险函数等。
  - 36/36 + 11/11 放行 + 8/8 基线
- - E2 · 不只策略
  - 只读账号兜底
  - 策略软件被绕过时，执行账号仍无写权限；旧 didilili（教材遗留的旧 ALL 权限账号，负向例子）的 ALL 是负向入口。
  - dw_reader：仅 SELECT [真库实证 SHOW GRANTS / 1142]
- - E3 · 失败可展示
  - 16 码 / 3 class
  - 策略拒绝统一 SQL_REJECTED，细因放 reason_code；取消/空结果/失败分开。16 码 = 6 可重试 + 10 不可重试。
  - p19 / p16 / p17 真跑
