answer_title: 一场有名字的接力
answer: 旅程不是一问一答，是 12 节点图上的接力：每步有名字，失败收得住。
answer_small: 中文提问 → POST /api/query（main.py:query）→ LangGraph 12 节点 / 10 步（graph.py + steps.yaml）→ validate_sql 双关 ⇄ correct_sql ≤1 次（=补考上限 N，契约 correction.max_attempts = 1 [当前值]）→ dw_reader（只读执行账号）只读执行 → SSE → 前端按契约渲染。
fig: materials/design/decision-growth/journey/journey-map.svg
figcap: 图 · 问数用户旅程（源码推导）：① 输入问题 → ② streamQuery → ③ SSE 流 → ④–⑧ LangGraph（8 上下文节点 → generate_sql → validate_sql ⇄ correct_sql → run_sql·dw_reader）→ ⑨–⑪ SSE 收尾 → 契约解析 → 步骤条/结果表/错误卡。
ev:
- - E1 · 每步有真事
  - 12 节点 / 10 步同源
  - 节点 id 逐字来自 steps.yaml；屏幕每一步对应图里真跑过的节点，没有先发事件再假装做事。12 个节点分属 steps.yaml 的 10 个 stage 分组（第 2 阶段「召回」含 3 个节点：列/值/指标）；correct_sql（第 9 阶段）是条件节点，界面在 12 个节点格上标「1 条件步」；图注 ①–⑪ 是旅程场景序号，不是节点数。
  - pytest test_steps_stages + test_s6_langgraph → 9 passed
- - E2 · 双保险有边界
  - 校验两道关 · 校正一次
  - validate_sql = guard（SQL 粗筛）+ policy（AST 安全复查；AST=SQL 拆成语法树）；校正后回 validate 重验；SQL_REJECTED 永不进 correction，次数写在契约里。16 码 = 6 可重试 + 10 不可重试。
  - 'errors.yaml → correction.max_attempts = 1（代码可证）'
- - E3 · 流必收尾 · 表不猜类型
  - 契约校验 + 类型渲染
  - SseParser/parseAgentEvent 按 sse.schema.json 运行时校验；列类型来自契约，空结果=空态不标红。
  - npm test → 40 passed（sse 26 + result 14）
checks:
- (cd system/backend && .venv/bin/python -m pytest tests/test_steps_stages.py tests/test_s6_langgraph.py -q) → 9 passed
- (cd system/frontend && npm test) → 40 passed
- (cd system/backend && .venv/bin/python -m pytest tests/security/ -q) → 179 passed / 2 skipped（2 skipped = 拒答题 OUT_OF_RANGE/UNSUPPORTED_INTENT 的 runtime skip）
- 'curl -N -X POST http://127.0.0.1:8000/api/query -H ''Content-Type: application/json'' -d ''{"query":"华北地区销售额是多少？"}''  # 前置：起栈；预期：逐节点 progress，以 result/error 收尾'
- 拆一刀（未跑，预期红）：把 steps.yaml 任一节点 id 改名 → test_steps_stages 红（图与契约漂移被机器抓住）
unknown: 真库侧部分实证（2026-11-27）：MySQL 3024→TIMEOUT 真库实测转正，SHOW GRANTS 只读校验已由安全链 S6 真库实证；1205/1317 未真触发（仅参数化单测）、执行期间取消丢结果的竞态无真并发测试；v1–v4 生长线是教学编撰（D57），无真实 commit 史料。
take: 带走一句话：好旅程不是「回答得快」，而是每一步都有名字——进度看得见、错误读得懂、失败收得住。
