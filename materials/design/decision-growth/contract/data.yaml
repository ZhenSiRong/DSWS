answer_title: 改一处，全都惊动
answer: 不是“配置集中”，是让 system 的派生链从同一棵契约树上长出来。
answer_small: 契约 → BuildPlan → Meta/ES/Qdrant → 文档/门禁；这里的消费者是 system 派生链，不是教学遗留的手抄常量。
