ev:
- - E1 · 条件可读
  - compose config 通过
  - 解析出 mysql/ES/Qdrant healthcheck；init 等 service_healthy；backend 等 init completed；frontend
    等 backend healthy。
  - docker compose config → 0
- - E2 · 一次性 init
  - Exited (0) 才能放行
  - init 等三存储、开通只读、校验元知识；失败不退出 0，backend 不启动。
  - page-13：init Exited (0)
- - E3 · 起得来≠部署好
  - smoke 8 步
  - 健康、init 退出码、端口、SSE 缓冲都要单独验；up 成功只说明容器建起来了。
  - DOCKER SMOKE 8/8 PASS（2026-11-27 真栈实测）
checks:
- docker compose config --quiet → 0
- docker compose ps -a → 期望 5 running + init Exited (0)
- make docker-smoke（前置：docker compose up -d，约 1 分钟；风险：会起/停容器；预期：8 步全过）
- 拆一刀（page-13 有记录）：删掉 compose.yaml 的 init 整段（含 backend 三行 depends_on）→ make docker-smoke 期望 3/8 红「init 没有成功退出」
- 失败注入：docker compose up -d --scale mysql=0 → 期望 init 打出「等待超时（180s）」Exited(1)、backend/frontend 未启动（2026-11-27 已实测）
unknown: 已实证：真栈 live up / 失败注入（2026-11-27）：--scale mysql=0 → init 等待超时 Exited(1)、backend/frontend 从未启动，恢复后 20s 全绿；nuance——scale=0 时 compose 把 service_healthy 当空满足放行 init，「停在 init 前」由 docker_init 的 180s 超时兜底。init 内部 2s 条件轮询 + 180s 上限（[当前值]）实测打出「等待超时（180s）」；仍未知：失败注入只做了 mysql=0 一个场景，其余失败模式（ES/Qdrant 宕机等）未注入；启动耗时不是设计承诺。
take: 带走一句话：启动不是“等”，是“每一级给出可判定条件，失败停在下游之前”。
