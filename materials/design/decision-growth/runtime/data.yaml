  add: 当前设计（真栈 2026-11-27 验证）
answer_title: 失败停在下游之前
answer: 不是盲等，是条件轮询 + 超时上限；失败停在下游之前。
answer_small: 三存储 healthy → init 退出 0 → backend healthy → frontend；init 内部还有 2s 条件轮询与 180s 上限（[当前值]），不是纯 sleep。
