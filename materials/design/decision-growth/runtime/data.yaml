title: 服务启动，靠盲等，还是靠健康条件和失败停点？
growth: 启动顺序不是设计出来的，是被假绿逼出来的
lead: 左页看设计怎么长出来：每一格是「做法 → 被什么打脸 → 补上了什么」；右页才是今天的设计与证据。
