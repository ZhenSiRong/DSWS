name: verify-line

# 教材可跟随性验收线（ADR 0002）：只跑离线 T0/T1，不启 docker、不需要模型 key。
# T2（全栈级考核）留在本机/夜间：见 docs/acceptance-line.md。
on:
  push:
    branches: [continue-iterate, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（backend 依赖由 uv.lock 固定）
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步 backend 依赖（--frozen，不改 uv.lock）
        run: uv sync --frozen --project backend

      - name: 安装 verify.py 依赖（宿主 python3 用 PyYAML）
        run: python3 -m pip install --user pyyaml

      - name: 结构审计（24 页 / 图引用 / README 坏链）
        run: python3 manual/shots/audit_book.py

      - name: T0 页面契约静态验收（<2s）
        run: python3 scripts/verify.py --fast

      - name: "T1 离线回归（执行 kind: offline 命令）"
        run: python3 scripts/verify.py

      - name: verify 单元测试
        run: python3 scripts/tests/test_verify.py
