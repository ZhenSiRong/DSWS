# 第 13 页 · 换真部署 —— 教材可跟随性契约（T0）
#
# schema 与规则见 manual/verify/README.md。
# 本页 coverage: static：整座城要 docker compose 起 6 个服务并构建镜像（首次约 8 分钟），
# 页内 make / docker / curl 命令都无法在 CI 无人值守执行；本页不执行任何块，
# 只做 T0 的静态存在性 + 符号命中（页面本身不挂 <!-- verify: --> 注解）。
page: page-13
title: 第 13 页 · 换真部署：一条命令起整座城，一条命令验收
coverage: static

static:
  paths:
    - compose.yaml
    - fixtures/dw.sql
    - scripts/docker-smoke.sh
    - scripts/lab
    - Makefile
    - docker/nginx.conf
  symbols:
    # init 服务跑的就是这个模块：改名 → init 起不来，backend 永远不会被放行
    - {file: compose.yaml, pattern: "app\\.scripts\\.docker_init"}
    # backend 必须等 init 退出码 0；拆一刀删的就是这条依赖（页面「还要删三行」）
    - {file: compose.yaml, pattern: "condition: service_completed_successfully"}
    # make docker-smoke 这个入口名是页面两条命令之一
    - {file: Makefile, pattern: "^docker-smoke:"}
    # 页面承诺的 smoke 末行
    - {file: scripts/docker-smoke.sh, pattern: '^echo "DOCKER SMOKE PASS"$'}
    # 6/8 的判据：/api/ 的代理缓冲必须关着
    - {file: docker/nginx.conf, pattern: "proxy_buffering off;"}
    # 首次建库的数据源；库名/建库语句没了，mysql 初始化即断
    - {file: fixtures/dw.sql, pattern: "CREATE DATABASE IF NOT EXISTS dw"}
