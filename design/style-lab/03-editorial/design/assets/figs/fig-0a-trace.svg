<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100"><defs><marker id="arrow-111111" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrow-1F4E9C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E9C"/></marker><marker id="arrow-B24A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B24A2E"/></marker><marker id="arrow-2F5D46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D46"/></marker><marker id="arrow-C58B1B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C58B1B"/></marker></defs><text x="80" y="76" font-family="Noto Sans CJK SC" font-size="42" font-weight="700" fill="#111111" text-anchor="start">一次真实问数：SQL 从哪来，在哪被拦</text><text x="80" y="118" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">示例：上个月华东的销售额是多少</text><circle cx="120" cy="218" r="27" fill="#1F4E9C"/><text x="120" y="227" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="170" y="212" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">用户提问</text><text x="170" y="246" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F4E9C" text-anchor="start">自然语言</text><rect x="400" y="170" width="1120" height="150" rx="4" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.6"/><text x="430" y="230" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">上个月华东的销售额是多少？</text><text x="430" y="272" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#5B5B5B" text-anchor="start">单轮 / 单库 / 只读 / 可拒答</text><circle cx="120" cy="390" r="27" fill="#1F4E9C"/><text x="120" y="399" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="170" y="384" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">生成 SQL</text><text x="170" y="418" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F4E9C" text-anchor="start">S4</text><rect x="400" y="342" width="1120" height="150" rx="4" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.6"/><rect x="420" y="352" width="1080" height="130" rx="3" fill="#151515"/><text x="440" y="387" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" fill="#F3EBDD" text-anchor="start">SELECT SUM(order_amount) AS 销售额</text><text x="440" y="414" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" fill="#F3EBDD" text-anchor="start">FROM fact_order JOIN dim_region</text><text x="440" y="441" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" fill="#F3EBDD" text-anchor="start">  ON fact_order.region_id = dim_region.region_id</text><text x="440" y="468" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" fill="#F3EBDD" text-anchor="start">WHERE dim_region.region_name = &#x27;华东&#x27;</text><text x="1250" y="387" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#C58B1B" text-anchor="end">或一次拒答</text><circle cx="120" cy="562" r="27" fill="#B24A2E"/><text x="120" y="571" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="170" y="556" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">策略闸</text><text x="170" y="590" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B24A2E" text-anchor="start">S5</text><rect x="400" y="514" width="1120" height="150" rx="4" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.6"/><text x="430" y="552" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2F5D46" text-anchor="start">PASS  单语句</text><text x="430" y="581" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2F5D46" text-anchor="start">PASS  只读根节点</text><text x="430" y="610" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2F5D46" text-anchor="start">PASS  表 / 列在白名单</text><text x="430" y="639" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2F5D46" text-anchor="start">PASS  补 LIMIT 1000</text><text x="900" y="574" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#B24A2E" text-anchor="start">UNION</text><text x="900" y="608" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B24A2E" text-anchor="start">→ SQL_REJECTED</text><text x="900" y="638" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#B24A2E" text-anchor="start">原因码在 detail</text><circle cx="120" cy="734" r="27" fill="#1F4E9C"/><text x="120" y="743" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="170" y="728" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">只读执行</text><text x="170" y="762" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F4E9C" text-anchor="start">S5</text><rect x="400" y="686" width="1120" height="150" rx="4" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.6"/><text x="430" y="736" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#1F4E9C" text-anchor="start">dw_reader</text><text x="430" y="774" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#5B5B5B" text-anchor="start">max_execution_time = 5000</text><text x="430" y="808" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#5B5B5B" text-anchor="start">执行 decision.sql，不是模型原文</text><circle cx="120" cy="906" r="27" fill="#1F4E9C"/><text x="120" y="915" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text><text x="170" y="900" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#111111" text-anchor="start">结果</text><text x="170" y="934" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F4E9C" text-anchor="start">S7</text><rect x="400" y="858" width="1120" height="150" rx="4" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.6"/><rect x="430" y="882" width="620" height="36" fill="#E7EDF8"/><text x="450" y="907" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#111111" text-anchor="start">地区</text><text x="700" y="907" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#111111" text-anchor="start">销售额</text><line x1="430" y1="918" x2="1050" y2="918" stroke="#111111" stroke-width="1.2"/><text x="450" y="956" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#111111" text-anchor="start">华东</text><text x="700" y="956" font-family="DejaVu Sans Mono" font-size="24" font-weight="400" fill="#111111" text-anchor="start">87200.0</text><text x="1100" y="918" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2F5D46" text-anchor="start">number → 数字</text><text x="1100" y="952" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" fill="#5B5B5B" text-anchor="start">不是 &quot;87200.0&quot;</text><text x="80" y="1040" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">关键：执行的是策略重新序列化后的 decision.sql；拒绝也是一个可判定的结论。</text></svg>