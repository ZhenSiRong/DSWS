<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100"><defs><marker id="arrow-111111" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrow-1F4E9C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E9C"/></marker><marker id="arrow-B24A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B24A2E"/></marker><marker id="arrow-2F5D46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D46"/></marker><marker id="arrow-C58B1B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C58B1B"/></marker></defs><text x="80" y="76" font-family="Noto Sans CJK SC" font-size="42" font-weight="700" fill="#111111" text-anchor="start">四道交接：每一站都要交出一个判据</text><text x="80" y="118" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">上一阶段留下风险，这一阶段压住不确定性，判据是一条可重复的命令。</text><text x="80" y="200" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#1F4E9C" text-anchor="start">S4 → S5</text><text x="350" y="200" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" fill="#D9D3C7" text-anchor="end">01</text><rect x="80" y="230" width="300" height="180" rx="4" fill="#FBF0EC" stroke="#B24A2E" stroke-width="2.4"/><text x="102" y="276" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B24A2E" text-anchor="start">留下的风险</text><text x="102" y="318" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">SQL 看起来对，但</text><text x="102" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">可能写库、越权、</text><text x="102" y="394" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">拖垮服务</text><line x1="230" y1="410" x2="230" y2="490" stroke="#111111" stroke-width="2.6" marker-end="url(#arrow-111111)"/><rect x="80" y="490" width="300" height="170" rx="4" fill="#E7EDF8" stroke="#1F4E9C" stroke-width="2.4"/><text x="102" y="536" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#1F4E9C" text-anchor="start">判据</text><text x="102" y="578" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">36 条注入全拒</text><text x="102" y="616" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">11 条零误杀</text><text x="460" y="200" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#1F4E9C" text-anchor="start">S5 → S6</text><text x="730" y="200" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" fill="#D9D3C7" text-anchor="end">02</text><rect x="460" y="230" width="300" height="180" rx="4" fill="#FBF0EC" stroke="#B24A2E" stroke-width="2.4"/><text x="482" y="276" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B24A2E" text-anchor="start">留下的风险</text><text x="482" y="318" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">拒绝是一个结论，</text><text x="482" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">但用户看不到结论</text><line x1="610" y1="410" x2="610" y2="490" stroke="#111111" stroke-width="2.6" marker-end="url(#arrow-111111)"/><rect x="460" y="490" width="300" height="170" rx="4" fill="#E7EDF8" stroke="#1F4E9C" stroke-width="2.4"/><text x="482" y="536" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#1F4E9C" text-anchor="start">判据</text><text x="482" y="578" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">每类失败对上</text><text x="482" y="616" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">码 / 类 / 步骤</text><text x="840" y="200" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#1F4E9C" text-anchor="start">S6 → S7</text><text x="1110" y="200" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" fill="#D9D3C7" text-anchor="end">03</text><rect x="840" y="230" width="300" height="180" rx="4" fill="#FBF0EC" stroke="#B24A2E" stroke-width="2.4"/><text x="862" y="276" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B24A2E" text-anchor="start">留下的风险</text><text x="862" y="318" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">事件有名字，但</text><text x="862" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">界面可能不认</text><line x1="990" y1="410" x2="990" y2="490" stroke="#111111" stroke-width="2.6" marker-end="url(#arrow-111111)"/><rect x="840" y="490" width="300" height="170" rx="4" fill="#E7EDF8" stroke="#1F4E9C" stroke-width="2.4"/><text x="862" y="536" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#1F4E9C" text-anchor="start">判据</text><text x="862" y="578" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">生成物与夹具</text><text x="862" y="616" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">逐字一致</text><text x="1220" y="200" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#1F4E9C" text-anchor="start">S7 → S8</text><text x="1490" y="200" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" fill="#D9D3C7" text-anchor="end">04</text><rect x="1220" y="230" width="300" height="180" rx="4" fill="#FBF0EC" stroke="#B24A2E" stroke-width="2.4"/><text x="1242" y="276" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B24A2E" text-anchor="start">留下的风险</text><text x="1242" y="318" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">开发机能跑，换</text><text x="1242" y="356" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">一台机器未必能起</text><line x1="1370" y1="410" x2="1370" y2="490" stroke="#111111" stroke-width="2.6" marker-end="url(#arrow-111111)"/><rect x="1220" y="490" width="300" height="170" rx="4" fill="#E7EDF8" stroke="#1F4E9C" stroke-width="2.4"/><text x="1242" y="536" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#1F4E9C" text-anchor="start">判据</text><text x="1242" y="578" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">启动链与</text><text x="1242" y="616" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">验收脚本</text><text x="80" y="740" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#5B5B5B" text-anchor="start">可停点 = 这一类不确定性有了可重复的判据，不是「功能做完」。</text><text x="80" y="790" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#5B5B5B" text-anchor="start">四站都交得出判据，才把「能跑」变成「敢用」。</text></svg>