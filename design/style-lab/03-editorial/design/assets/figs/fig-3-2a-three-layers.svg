<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100"><defs><marker id="arrow-111111" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrow-1F4E9C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E9C"/></marker><marker id="arrow-B24A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B24A2E"/></marker><marker id="arrow-2F5D46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D46"/></marker><marker id="arrow-C58B1B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C58B1B"/></marker></defs><text x="80" y="76" font-family="Noto Sans CJK SC" font-size="42" font-weight="700" fill="#111111" text-anchor="start">三层单向依赖：改契约，不改生成物</text><text x="80" y="118" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">契约 → 生成物 → 运行时；箭头只向下，手改生成物等于在运行时层伪造事实源。</text><rect x="140" y="180" width="1100" height="190" rx="4" fill="#EEF4EF" stroke="#2F5D46" stroke-width="2.4"/><text x="162" y="226" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#2F5D46" text-anchor="start">事实源</text><text x="162" y="268" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">contracts/*.yaml / *.json</text><text x="162" y="306" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">表、列、步骤、错误码</text><rect x="140" y="470" width="1100" height="190" rx="4" fill="#E7EDF8" stroke="#1F4E9C" stroke-width="2.4"/><text x="162" y="516" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F4E9C" text-anchor="start">生成物</text><text x="162" y="558" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">frontend/src/generated/*</text><text x="162" y="596" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">由契约生成，不能手改</text><rect x="140" y="760" width="1100" height="190" rx="4" fill="#FBF3E2" stroke="#C58B1B" stroke-width="2.4"/><text x="162" y="806" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#C58B1B" text-anchor="start">运行时</text><text x="162" y="848" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">SseParser / App.tsx</text><text x="162" y="886" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#5B5B5B" text-anchor="start">只读生成物，不回头改契约</text><line x1="690" y1="370" x2="690" y2="460" stroke="#2F5D46" stroke-width="2.6" marker-end="url(#arrow-2F5D46)"/><text x="710" y="425" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#2F5D46" text-anchor="start">生成</text><line x1="690" y1="660" x2="690" y2="750" stroke="#1F4E9C" stroke-width="2.6" marker-end="url(#arrow-1F4E9C)"/><text x="710" y="715" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#1F4E9C" text-anchor="start">约束</text><line x1="1300" y1="850" x2="1300" y2="330" stroke="#B24A2E" stroke-width="2.2" stroke-dasharray="8 8" marker-end="url(#arrow-B24A2E)"/><text x="1322" y="560" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B24A2E" text-anchor="start">手改 =</text><text x="1322" y="594" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B24A2E" text-anchor="start">伪造事实源</text><text x="1322" y="640" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#B24A2E" text-anchor="start">--check 会红</text></svg>