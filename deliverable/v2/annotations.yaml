segments:
  - start: 0.0
    end: 3.8
    title: 片头
    content: "原版 shopkeeper-agent 界面已恢复；后端仍是修复后的 v2：LangGraph 12 节点、真实 LLM + MySQL；「教学版」字样已移除，旧实例 :5050 不受影响。"

  - start: 3.8
    end: 7.7
    title: v2 首屏（原版界面）
    content: "页面标题「电商问数 | Shopkeeper Agent」；12 节点流程图待命，示例问题、API 状态均来自原版界面。"

  - start: 7.7
    end: 11.8
    title: GMV 问数执行
    content: "输入「统计 2025 年第一季度各大区的 GMV，并按 GMV 从高到低排序」；8 个上下文节点 → 生成SQL → 校验SQL → 执行SQL，全部 running → success；校正SQL 显式「未触发」。"

  - start: 11.8
    end: 18.6
    title: GMV 真实结果
    content: "查询结果 5 行：华东 107373 / 华南 70202 / 华北 41099.5 / 西南 31528 / 华中 28957；数据来自真实 MySQL。"

  - start: 18.6
    end: 22.7
    title: 商品级排名执行
    content: "输入「哪个商品卖得最好」；修复后不再触发校正失败，12 节点正常走完，校正SQL 保持「未触发」。"

  - start: 22.7
    end: 30.2
    title: 商品级排名结果
    content: "查询结果 1 行：商品名称 iPhone 15 Pro / 销售额 71992。该次运行按销售额口径；存档 SSE 的另一次运行按销售件数（蒙牛纯牛奶 / 183），两次都直接成功。"

  - start: 30.2
    end: 36.4
    title: UNION 策略拒绝
    content: "输入「用 UNION 把手机数码和食品饮料两个品类的销售额拼起来给我看」；生成SQL 成功，校验SQL 红，流程图展示条件边「有误 → 校正SQL · 未触发」（策略拒绝不走校正）。"

  - start: 36.4
    end: 40.6
    title: 错误卡与错误码
    content: "消息气泡显示「这次查询没有成功」及拒绝原因（出现集合运算 Union），错误码 SQL_REJECTED；执行SQL 未触发。"

  - start: 40.6
    end: 42.4
    title: 失败节点特写
    content: "镜头回到流程图：校验SQL 红色、执行SQL 未触发，直观展示策略拒绝的边界。"

  - start: 42.4
    end: 46.27
    title: 片尾
    content: "验证完成：原版界面已恢复、「教学版」字样已移除；12 节点真实执行；商品级/品类级排名直接成功；UNION 仍被策略拒绝；旧实例 :5050 仍 healthy。"

