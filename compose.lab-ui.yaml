# 原版界面 + 当前 worktree 后端 —— 完全独立的一套栈（含自己的存储）
#
#   docker compose -f compose.lab-ui.yaml --env-file .env -p dsws-lab-ui up -d --build
#
# 与主栈（dsws-trace）完全隔离：
#   - 自己的 MySQL / ES / Qdrant + 自己的卷（lab_*），不共享任何数据；
#   - 自己的 init：把 dw.sql 灌进 MySQL、把元知识写进 ES/Qdrant；
#   - 后端从本 worktree 构建（镜像 dsws-lab/backend:local），改代码后
#     `up -d --build backend` 即生效；
#   - 界面复用旧镜像 docker-web:latest 里打好的原版产物，只覆盖 nginx 配置。
#
# 端口全部避开主栈：13306 / 19202 / 16333 / 18100 / 18081。
name: dsws-lab-ui

x-backend-env: &backend-env
  REBUILD_MYSQL_HOST: mysql
  REBUILD_MYSQL_PORT: "3306"
  REBUILD_MYSQL_USER: didilili
  REBUILD_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
  REBUILD_META_DB: meta_rebuild
  REBUILD_ES_URL: http://elasticsearch:9200
  REBUILD_QDRANT_URL: http://qdrant:6333

services:
  mysql:
    image: ${MYSQL_IMAGE:?}
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?}
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=dw
      - MYSQL_USER=didilili
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "127.0.0.1:${LAB_MYSQL_PORT:-13306}:3306"
    volumes:
      - lab_mysql_data:/var/lib/mysql
      - ./system/fixtures/dw.sql:/docker-entrypoint-initdb.d/10-dw.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?}
    restart: unless-stopped
    # ES 用主机名做节点发现，容器 ID 在带 search 域的网络里解析不了
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # 本机磁盘已到 93%，ES 默认 90% 高水位会直接让分片无法分配、集群 RED。
      # 这是实验栈，允许写满：关掉磁盘水位线（只影响这个容器）。
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:${LAB_ES_PORT:-19202}:9200"
    volumes:
      - lab_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  qdrant:
    image: ${QDRANT_IMAGE:?}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB_QDRANT_PORT:-16333}:6333"
    volumes:
      - lab_qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像里没有 curl / wget，只有 bash——用 /dev/tcp 自己发一个请求
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  init:
    image: dsws-lab/backend:local
    restart: "no"
    command: ["python", "-m", "app.scripts.docker_init"]
    environment:
      - REBUILD_MYSQL_HOST=mysql
      - REBUILD_MYSQL_PORT=3306
      - REBUILD_MYSQL_USER=didilili
      - REBUILD_MYSQL_PASSWORD=${MYSQL_PASSWORD:?}
      - REBUILD_MYSQL_ROOT_USER=root
      - REBUILD_MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?}
      - REBUILD_DW_RO_PASSWORD=${REBUILD_DW_RO_PASSWORD:?}
      - REBUILD_ES_URL=http://elasticsearch:9200
      - REBUILD_QDRANT_URL=http://qdrant:6333
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  backend:
    image: dsws-lab/backend:local
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - "1"
    environment:
      <<: *backend-env
      REBUILD_DW_RO_PASSWORD: ${REBUILD_DW_RO_PASSWORD:?}
      REBUILD_LLM_BASE_URL: ${REBUILD_LLM_BASE_URL:-}
      REBUILD_LLM_API_KEY: ${REBUILD_LLM_API_KEY:-}
      REBUILD_LLM_MODEL: ${REBUILD_LLM_MODEL:-}
      REBUILD_LLM_TIMEOUT: ${REBUILD_LLM_TIMEOUT:-30}
    ports:
      - "127.0.0.1:${LAB_BACKEND_PORT:-18100}:8100"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ui:
    image: docker-web:latest
    restart: unless-stopped
    volumes:
      - ./system/docker/nginx-legacy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LAB_UI_BIND:-0.0.0.0}:${LAB_UI_PORT:-18081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  lab_mysql_data:
  lab_es_data:
  lab_qdrant_data:
